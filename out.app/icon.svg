<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#060D1A;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#060D1A" stroke="url(#grad)" stroke-width="12" />
  <!-- Radial Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />
  <!-- Pulse Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00BCD4" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1E88E5" stroke-width="10" opacity="0.7" />
  <!-- Siren/Bell Icon -->
  <g transform="translate(186, 176)">
    <!-- Siren Beacon -->
    <path d="M70,20 C100,20 110,60 110,90 L30,90 C30,60 40,20 70,20 Z" fill="url(#grad)" />
    <!-- Siren Base -->
    <rect x="10" y="90" width="120" height="24" rx="8" fill="#E8F0FE" />
    <rect x="30" y="118" width="80" height="12" rx="6" fill="#8AA3C8" />
    <!-- Ray Glows -->
    <line x1="70" y1="0" x2="70" y2="12" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    <line x1="20" y1="20" x2="32" y2="32" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    <line x1="120" y1="20" x2="108" y2="32" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
